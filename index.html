<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A letter for my Babu</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #ffe4ec 0%, #fff1f2 40%, #e0f2fe 100%);
      font-family: 'Nunito', sans-serif;
      color: #4a2835;
      display: flex;
      justify-content: center;
      padding: 24px 14px 60px;
      overflow-x: hidden;
      position: relative;
    }
    .floating-heart {
      position: fixed;
      pointer-events: none;
      opacity: 0.28;
      animation: floatUp 8s linear infinite;
      z-index: 0;
      font-size: 20px;
    }
    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.8) rotate(0deg); opacity: 0; }
      20% { opacity: 0.35; }
      80% { opacity: 0.35; }
      100% { transform: translateY(-10vh) scale(1.2) rotate(40deg); opacity: 0; }
    }
    .wrapper {
      max-width: 580px;
      width: 100%;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 26px;
      padding: 24px 20px;
      box-shadow: 0 14px 34px rgba(244, 114, 182, 0.15), 0 2px 8px rgba(0,0,0,0.03);
      border: 2px solid #fce7f3;
      text-align: center;
    }
    .tag {
      display: inline-block;
      background: #fdf2f8;
      color: #db2777;
      font-size: 13px;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid #fbcfe8;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      color: #9d174d;
      margin-bottom: 10px;
      line-height: 1.25;
    }
    .handwriting {
      font-family: 'Caveat', cursive;
      font-size: 24px;
      color: #be185d;
      line-height: 1.35;
    }
    p {
      line-height: 1.6;
      color: #64384a;
      font-size: 15px;
    }
    .cards-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 10px;
      text-align: left;
    }
    .interactive-card {
      background: #fff;
      border: 2px dashed #f472b6;
      border-radius: 18px;
      padding: 14px 18px;
      cursor: pointer;
      transition: all 0.22s ease;
      position: relative;
    }
    .interactive-card:hover {
      transform: translateY(-2px);
      background: #fff9fb;
      box-shadow: 0 6px 16px rgba(244, 114, 182, 0.18);
    }
    .card-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      color: #9d174d;
      font-size: 16px;
    }
    .card-secret-content {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #fbcfe8;
      font-size: 14.5px;
      color: #4a2835;
      line-height: 1.55;
    }
    .ticket {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      border: 2px dashed #0284c7;
      border-radius: 20px;
      padding: 20px;
      position: relative;
      text-align: left;
      margin-top: 6px;
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
    }
